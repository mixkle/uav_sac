# Main physical model, explicit CPU integrity-test overrides.
env:
  disconnection_weight: 0.1  # 断联惩罚权重 μ；设为 0 可关闭，奖励扣除 μ × 断联比例
algo:
  batch_size: 64
  replay_capacity: 4096
  warmup_steps: 256
run:
  seed: 0
  device: cpu
  num_envs: 2
  cpu_threads: 1
  numba_threads: 2
  total_steps: 4096
  eval_interval: 2048
  log_interval: 256
  validation_seeds: [10000, 10001, 10002, 10003]
  tensorboard: false
