# 基于 main.yaml 的连续动作 SAC；250,000 条联合环境转移。
# 奖励 r = 覆盖率 - 0.5 × 断联UAV比例。
env:
  action_space: continuous
  throughput_weight: 0.0
  robustness_weight: 0.0
  disconnection_weight: 0.5
  width: 1600.0
  height: 1600.0
  num_uavs: 16
  num_users: 180
  user_initialization: gaussian_mixture
  user_initial_margin_fraction: 0.1
  user_cluster_std_fraction: 0.08
  user_cluster_centers:
  - [0.3, 0.3]
  - [0.7, 0.3]
  - [0.3, 0.7]
  - [0.7, 0.7]
  bs_positions:
  - [0.0, 0.0, 0.0]
  - [0.0, 1600.0, 0.0]
  horizon: 600
  uu_range: 400.0
  ug_range: 350.0
  beacon_power_dbm: 0.0
  beacon_bandwidth_hz: 180000.0
  beacon_noise_figure_db: 9.0
  sensing_threshold_db: 5.0
  backend: numba
  uav_initialization: uniform
algo:
  name: sac
  ue_hidden: 32
  discount: 0.995
  initial_alpha: 0.01
  replay_capacity: 50000
run:
  seed: 0
  num_envs: 16
  device: auto
  cpu_threads: 1
  numba_threads: 4
  total_steps: 250000
  memory_limit_gib: 12.0
