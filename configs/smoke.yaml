# Uniform random UAV initialization; no coverage/connectivity rejection.
env:
  disconnection_weight: 0.1  # 断联惩罚权重 μ；设为 0 可关闭，奖励扣除 μ × 断联比例
  width: 400.0
  height: 400.0
  num_uavs: 4
  num_users: 24
  capacity: 6
  bs_positions:
  - - 0.0
    - 0.0
    - 0.0
  - - 0.0
    - 400.0
    - 0.0
  uu_range: 200.0
  ug_range: 180.0
  horizon: 32
  backend: numba
  uav_initialization: uniform
algo:
  hidden: 32
  ue_hidden: 32
  batch_size: 32
  replay_capacity: 512
  warmup_steps: 64
  rollout_steps: 8
  ppo_epochs: 2
  ppo_minibatches: 2
run:
  seed: 0
  device: cpu
  num_envs: 2
  numba_threads: 2
  total_steps: 256
  eval_interval: 128
  log_interval: 64
  validation_seeds:
  - 10000
  - 10001
  test_seeds:
  - 20000
  - 20001
  tensorboard: false
