# Uniform random UAV initialization; no coverage/connectivity rejection.
env:
  disconnection_weight: 0.1  # 断联惩罚权重 μ；设为 0 可关闭，奖励扣除 μ × 断联比例
  width: 1600.0
  height: 1600.0
  num_uavs: 16
  num_users: 180
  user_initial_margin_fraction: 0.1
  user_cluster_std_fraction: 0.08
  user_cluster_centers:
  - - 0.3
    - 0.3
  - - 0.7
    - 0.3
  - - 0.3
    - 0.7
  - - 0.7
    - 0.7
  bs_positions:
  - - 0.0
    - 0.0
    - 0.0
  - - 0.0
    - 1600.0
    - 0.0
  horizon: 600
  uu_range: 400.0
  ug_range: 350.0
  beacon_power_dbm: 0.0
  beacon_bandwidth_hz: 180000.0
  beacon_noise_figure_db: 9.0
  sensing_threshold_db: 5.0
  backend: numba
  uav_initialization: uniform
algo:
  name: sac
  ue_hidden: 32
  discount: 0.995
  initial_alpha: 0.01
  replay_capacity: 50000
  batch_size: 256
  warmup_steps: 10000
  transitions_per_update: 4
run:
  seed: 0
  num_envs: 16
  device: cpu
  cpu_threads: 8
  numba_threads: 4
  total_steps: 50000
  memory_limit_gib: 12.0
  eval_interval: 10000
  checkpoint_minutes: 10.0
  tensorboard: true
